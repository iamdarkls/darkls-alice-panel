<!doctype html>
<html lang="ru">
<head>
<script src="static/panel-context.js"></script>

<link rel="stylesheet" href="static/speaker-selector.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DARKLS Alice Panel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="static/vendor/xterm/xterm.css">
<link rel="icon" type="image/png" href="static/icons/favicon-64.png">
<link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
<meta name="theme-color" content="#F6F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111116" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Станция">
<script>
  // тема и акцент из настроек «Обзора» — до отрисовки, чтобы не мигало
  try {
    const th = localStorage.getItem('ui.theme'), ac = localStorage.getItem('ui.accent');
    if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
    if (ac) {
      const s = document.documentElement.style;
      s.setProperty('--accent', ac);
      s.setProperty('--accent-ink', `color-mix(in srgb, ${ac} 72%, var(--text))`);
      s.setProperty('--accent-soft', `color-mix(in srgb, ${ac} 15%, var(--card))`);
    }
    window.__vizOff = localStorage.getItem('ui.viz') === '0';
  } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
